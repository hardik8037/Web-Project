<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- SEO Meta Tags -->
  <title>Botzo.io — AI Business Automation & Communication Ecosystem</title>
  <meta name="description" content="Botzo.io is the complete business automation platform — WhatsApp API, Instagram & Facebook automation, CRM, workflow builder, bulk campaigns, and digital marketing services.">
  <meta name="keywords" content="WhatsApp API, business automation, chatbot, CRM, workflow automation, bulk messaging, digital marketing">
  <meta name="author" content="Botzo.io">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://botzo.io/">
  <meta name="theme-color" content="#050505">

  <!-- Open Graph -->
  <meta property="og:title" content="Botzo.io — AI Business Automation & Communication Ecosystem">
  <meta property="og:description" content="Automate WhatsApp, Instagram, Facebook. CRM, workflows, bulk campaigns, and full digital marketing services — all in one platform.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://botzo.io/">
  <meta property="og:image" content="https://botzo.io/assets/images/og-image.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Botzo.io — AI Business Automation Ecosystem">
  <meta name="twitter:description" content="Automate everything. Communicate everywhere. Grow without limits.">
  <meta name="twitter:image" content="https://botzo.io/assets/images/og-image.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">

    <!-- DOMPurify for XSS Protection -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js" integrity="sha512-H9y4UaFpOqRo4HRjfO46/R/4Jg8mFqQ48pT01u03V8n2+z2Fm1Z06RykYfE2DPCY1/sT7oM2aR1GZofD02Ercw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!-- Preload critical assets -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="/src/styles/globals.css">

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Botzo.io",
    "url": "https://botzo.io",
    "description": "AI Business Automation & Communication Ecosystem",
    "logo": "https://botzo.io/assets/images/logo.png",
    "sameAs": [
      "https://www.linkedin.com/company/botzo",
      "https://twitter.com/botzo_io",
      "https://www.instagram.com/botzo.io"
    ]
  }
  </script>
  <style>
    /* Prevent FOUC / white flash before globals.css loads */
    body {
      background-color: #050505; /* Matches var(--color-dark-bg) */
      color: #F5F5F7;
      margin: 0;
    }
    #loader {
      background-color: #050505;
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <!-- ═══ LOADING SCREEN ═══ -->
  <div id="loader" class="loader">
    <div class="loader-inner">
      <div class="loader-logo">
        <img src="/assets/images/logo.png" alt="Botzo.io" style="height:48px;width:auto;" />
      </div>
      <div class="loader-bar"><div class="loader-bar-fill" id="loader-bar-fill"></div></div>
    </div>
  </div>
  <script>
    // Start progress bar animation instantly on parser execution
    setTimeout(function() {
      var fill = document.getElementById('loader-bar-fill');
      if (fill) fill.style.width = '70%';
    }, 50);
  </script>

  <!-- ═══ APP ROOT ═══ -->
  <div id="app"></div>

  <!-- Main Script -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
