  <style>
    /* Prevent FOUC / white flash before globals.css loads */
    body {
      background-color: #050505;
      color: #F5F5F7;
      margin: 0;
    }
    /* The app renders immediately underneath the loader for fast LCP */
    #app {
      width: 100%;
      min-height: 100vh;
    }
    #loader {
      background-color: #050505;
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #loader.loaded {
      opacity: 0;
      pointer-events: none;
    }
    .loader-terminal {
      font-family: 'SF Mono', 'Roboto Mono', 'Fira Code', monospace;
      font-size: clamp(0.9rem, 4vw, 1.5rem);
      font-weight: 600;
      display: flex;
      align-items: center;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .loader-prefix {
      color: #8b5cf6;
      margin-right: 10px;
      font-weight: 700;
    }
    #loader-typewriter-text {
      background: linear-gradient(90deg, #fff, #c4b5fd);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }
    .jump-dots {
      display: inline-block;
      color: #a78bfa; /* Matches the end of the text gradient */
      margin-left: 2px;
    }
    .jump-dot {
      display: inline-block;
      animation: jumpDot 1s infinite ease-in-out;
      will-change: transform;
    }
    .jump-dot:nth-child(1) { animation-delay: 0s; }
    .jump-dot:nth-child(2) { animation-delay: 0.15s; }
    .jump-dot:nth-child(3) { animation-delay: 0.3s; }
    
    .loader-cursor {
      color: #00E6FF;
      font-weight: 700;
      margin-left: 4px;
      animation: blinkCursor 0.8s step-end infinite;
      will-change: opacity;
    }
    @keyframes blinkCursor {
      50% { opacity: 0; }
    }
    @keyframes jumpDot {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
  </style>
</head>
<body>
  <!-- ═══ LOADING SCREEN ═══ -->
  <div id="loader" class="loader">
    <div class="loader-terminal">
      <span class="loader-prefix">></span>
      <span id="loader-typewriter-text"></span><span class="jump-dots"><span class="jump-dot">.</span><span class="jump-dot">.</span><span class="jump-dot">.</span></span><span class="loader-cursor">_</span>
    </div>
  </div>

  <!-- Cinematic Loader Script moved to main.js for CSP compliance -->

  <!-- ═══ APP ROOT ═══ -->
  <div id="app"></div>

  <!-- Main Script -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
